name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday

permissions:
  contents: read

# New pushes to a PR supersede older runs; main runs are never cancelled.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Skip release-please: PR branches and merge commits to main (only this
    # repo's own branches; a fork PR can pick any branch name)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'pull_request'
          && !(startsWith(github.head_ref, 'release-please--')
               && github.event.pull_request.head.repo.full_name == github.repository))
      || (github.event_name == 'push'
          && !startsWith(github.event.head_commit.message, 'chore(main): release'))
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
