name: Release

on:
  push:
    branches: [main]

# Read-only by default; each job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  # IMPORTANT: Do not use "Re-run all jobs" on this workflow.
  # Re-running this job after a release was already created causes all downstream
  # publish jobs to be SKIPPED — release-please sees the release already exists and
  # emits no release_created output. If a publish job failed, re-run only that specific
  # job. If jobs were skipped (not failed), make a new bump commit to create a fresh release.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # One release-please at a time. When several PRs merge back to back, a
    # queued run is replaced by the newest one; that is safe because every
    # run releases all merged-but-untagged release PRs, not just its own.
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      release_prs_failed: ${{ steps.prs.outcome == 'failure' && steps.prs-retry.outcome != 'success' }}
      pywire--release_created: ${{ steps.release.outputs['packages/pywire--release_created'] }}
      pywire--tag_name: ${{ steps.release.outputs['packages/pywire--tag_name'] }}
      pywire-parser--release_created: ${{ steps.release.outputs['packages/pywire-parser--release_created'] }}
      pywire-parser--tag_name: ${{ steps.release.outputs['packages/pywire-parser--tag_name'] }}
      pywire-auth--release_created: ${{ steps.release.outputs['packages/pywire-auth--release_created'] }}
      pywire-auth--tag_name: ${{ steps.release.outputs['packages/pywire-auth--tag_name'] }}
      pywire-cli--release_created: ${{ steps.release.outputs['packages/pywire-cli--release_created'] }}
      pywire-cli--tag_name: ${{ steps.release.outputs['packages/pywire-cli--tag_name'] }}
      pywire-templates--release_created: ${{ steps.release.outputs['packages/pywire-templates--release_created'] }}
      pywire-templates--tag_name: ${{ steps.release.outputs['packages/pywire-templates--tag_name'] }}
      pywire-language-server--release_created: ${{ steps.release.outputs['packages/pywire-language-server--release_created'] }}
      pywire-language-server--tag_name: ${{ steps.release.outputs['packages/pywire-language-server--tag_name'] }}
      vscode-pywire--release_created: ${{ steps.release.outputs['packages/vscode-pywire--release_created'] }}
      vscode-pywire--tag_name: ${{ steps.release.outputs['packages/vscode-pywire--tag_name'] }}
      tree-sitter-pywire--release_created: ${{ steps.release.outputs['packages/tree-sitter-pywire--release_created'] }}
      tree-sitter-pywire--tag_name: ${{ steps.release.outputs['packages/tree-sitter-pywire--tag_name'] }}
      prettier-plugin-pywire--release_created: ${{ steps.release.outputs['packages/prettier-plugin-pywire--release_created'] }}
      create-pywire-app--release_created: ${{ steps.release.outputs['packages/create-pywire-app--release_created'] }}
      create-pywire-app-npm--release_created: ${{ steps.release.outputs['packages/create-pywire-app-npm--release_created'] }}
      pywire-docs--release_created: ${{ steps.release.outputs['docs--release_created'] }}
    steps:
      # Tags and GitHub releases first, in a step of their own. Release PR
      # creation runs separately below and may not fail this job: a failed
      # job skips every publish job, and a re-run then finds the release
      # already created and publishes nothing (see the warning above).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # Push release PRs as a user, not GITHUB_TOKEN: GITHUB_TOKEN pushes
          # start CI/CodeQL runs that sit in "action required" and then show
          # as failed once the PR merges and its branch is deleted.
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # release-please opens every package's PR in parallel, and one GitHub
      # API error fails them all ("release-please failed: " with an empty
      # message, 2026-09-29: branches pushed, PRs missing). The run is
      # idempotent, so retry once after a pause; release-prs-status turns
      # the run red if both attempts fail, without blocking any publish.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: prs
        continue-on-error: true
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      - name: Wait before retrying release PRs
        if: steps.prs.outcome == 'failure'
        run: sleep 60
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: prs-retry
        if: steps.prs.outcome == 'failure'
        continue-on-error: true
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Release PRs only bump versions/changelogs, so don't wait on CI: set
  # success statuses for the required CI checks, and evaluate the release
  # floors gate for real. A separate job so it can never block a publish.
  # No step may push to release branches after this, or the new head loses
  # these statuses; release-please ("always-update") already rebuilds every
  # release PR from the latest main on each run.
  release-prs-status:
    name: "Stamp release PRs"
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: stamp-release-prs-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Workspace checkout for the release floors gate (floors live on main;
      # release PRs never change them).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set CI statuses + release floors gate on release-please PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          RELEASE_AUTHOR=$(GH_TOKEN="$RELEASE_PAT" gh api user --jq .login)
          export RELEASE_AUTHOR
          .github/scripts/stamp-release-prs.sh
      - name: Fail if release PRs could not be updated
        if: needs.release-please.outputs.release_prs_failed == 'true'
        run: |
          echo "::error::release-please could not open or update the release PRs (twice). Re-run the failed release-please job; publishes were not affected."
          exit 1

  # After a publish, raise every downstream floor to the new version through
  # an auto-merging PR (check-floors wants floors >= latest published), then
  # re-evaluate the release floors gates, which a publish can turn green.
  bump-floors:
    name: "Bump downstream floors"
    needs:
      - release-please
      - publish-pywire
      - publish-tree-sitter-pywire
      - publish-pywire-parser
      - publish-pywire-auth
      - publish-pywire-cli
      - publish-pywire-templates
      - publish-language-server
      - publish-create-app
    if: >-
      always()
      && needs.release-please.result == 'success'
      && (needs.publish-pywire.result == 'success'
          || needs.publish-tree-sitter-pywire.result == 'success'
          || needs.publish-pywire-parser.result == 'success'
          || needs.publish-pywire-auth.result == 'success'
          || needs.publish-pywire-cli.result == 'success'
          || needs.publish-pywire-templates.result == 'success'
          || needs.publish-language-server.result == 'success'
          || needs.publish-create-app.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: bump-floors-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Push as a user so the PR's CI runs (GITHUB_TOKEN pushes don't).
          token: ${{ secrets.RELEASE_PAT }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Open auto-merging floor bump PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          OUTPUTS: ${{ toJSON(needs.release-please.outputs) }}
        run: |
          # "pywire-parser-v0.8.0" -> "pywire-parser=0.8.0" for every tag this run cut.
          mapfile -t expect < <(echo "$OUTPUTS" | jq -r '
            to_entries[] | select(.key | endswith("--tag_name")) | .value | select(. != "")
            | capture("^(?<n>.+)-v(?<v>[0-9][^ ]*)$") | "\(.n)=\(.v)"')
          .github/scripts/bump-floors.sh "${expect[@]}"
      - name: Re-evaluate release floors gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          RELEASE_AUTHOR=$(GH_TOKEN="$RELEASE_PAT" gh api user --jq .login)
          export RELEASE_AUTHOR
          .github/scripts/stamp-release-prs.sh

  # Build pywire (pure Python wheel + sdist)
  build-pywire:
    name: "Build pywire"
    needs: release-please
    if: needs.release-please.outputs.pywire--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - name: Build JS client
        run: pnpm install && pnpm build
        working-directory: packages/pywire/src/pywire/client
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pywire-dist
          path: packages/pywire/dist/*

  # Publish pywire to PyPI
  publish-pywire:
    name: "Publish pywire to PyPI"
    needs: build-pywire
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pywire-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # Build and publish tree-sitter-pywire (C extension wheels)
  build-tree-sitter-pywire:
    name: "Build tree-sitter-pywire wheels"
    needs: release-please
    if: needs.release-please.outputs.tree-sitter-pywire--release_created == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: packages/tree-sitter-pywire
        env:
          CIBW_BUILD: "cp310-*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-pywire-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-tree-sitter-pywire-sdist:
    name: "Build tree-sitter-pywire sdist"
    needs: release-please
    if: needs.release-please.outputs.tree-sitter-pywire--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --sdist --out-dir dist
        working-directory: packages/tree-sitter-pywire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-pywire-sdist
          path: packages/tree-sitter-pywire/dist/*.tar.gz

  build-tree-sitter-pywire-wasm:
    name: "Build tree-sitter-pywire WASM wheel"
    needs: release-please
    if: needs.release-please.outputs.tree-sitter-pywire--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false
      - name: Install pyodide-build
        # Install both pyodide-cli and pyodide-build into the same venv so that
        # pyodide-cli can discover pyodide-build's plugin entry points (xbuildenv, build).
        # uv tool install --with does not register entry points across packages.
        run: |
          uv venv .pyodide-venv --python 3.13
          uv pip install --python .pyodide-venv/bin/python --prerelease=allow pyodide-build==0.29.3 pyodide-cli "wheel<0.44"
          echo "$(pwd)/.pyodide-venv/bin" >> "$GITHUB_PATH"
      - name: Set up Pyodide cross-build environment
        run: pyodide xbuildenv install 0.29.3
      - name: Set up Emscripten
        run: |
          EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version)
          echo "Using Emscripten $EMSCRIPTEN_VERSION"
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk activate "$EMSCRIPTEN_VERSION"
          source ./emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          [ -n "$EM_CONFIG" ] && echo "EM_CONFIG=$EM_CONFIG" >> "$GITHUB_ENV" || true
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build WASM wheel
        run: pyodide build . --outdir dist
        working-directory: packages/tree-sitter-pywire
        env:
          EMCC_SKIP_WASM_OPT: "1"
          EM_IGNORE_WASM_OPT: "1"
      - name: Upload WASM wheel to R2 CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wheel=$(ls packages/tree-sitter-pywire/dist/*.whl | head -1)
          filename=$(basename "$wheel")
          tag="${{ needs.release-please.outputs['tree-sitter-pywire--tag_name'] }}"
          version="${tag#tree-sitter-pywire-v}"
          npx wrangler r2 object put "pywire-cdn/tree-sitter-pywire/v${version}/${filename}" \
            --file "$wheel" \
            --content-type "application/zip" \
            --remote
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-pywire-wasm
          path: packages/tree-sitter-pywire/dist/*.whl

  publish-tree-sitter-pywire:
    name: "Publish tree-sitter-pywire to PyPI"
    needs: [build-tree-sitter-pywire, build-tree-sitter-pywire-sdist, build-tree-sitter-pywire-wasm]
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tree-sitter-pywire-*
          path: dist
          merge-multiple: true
      - name: Remove WASM wheels (PyPI rejects WASM platform tags)
        run: find dist -name '*wasm32*' -delete
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # Build and publish pywire-parser (pure Python)
  publish-pywire-parser:
    name: "Publish pywire-parser to PyPI"
    needs: release-please
    if: needs.release-please.outputs.pywire-parser--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire-parser
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/pywire-parser/dist/

  # Build and publish pywire-auth (pure Python)
  publish-pywire-auth:
    name: "Publish pywire-auth to PyPI"
    needs: release-please
    if: needs.release-please.outputs.pywire-auth--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire-auth
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/pywire-auth/dist/

  # Publish pywire-cli to PyPI
  publish-pywire-cli:
    name: "Publish pywire-cli to PyPI"
    needs: release-please
    if: needs.release-please.outputs.pywire-cli--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire-cli
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/pywire-cli/dist/

  # Publish pywire-templates to PyPI
  publish-pywire-templates:
    name: "Publish pywire-templates to PyPI"
    needs: release-please
    if: needs.release-please.outputs.pywire-templates--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire-templates
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/pywire-templates/dist/

  # Publish language server to PyPI
  publish-language-server:
    name: "Publish pywire-language-server to PyPI"
    needs: release-please
    if: needs.release-please.outputs.pywire-language-server--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire-language-server
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/pywire-language-server/dist/

  # Publish VS Code extension
  publish-vscode:
    name: "Publish vscode-pywire"
    needs: release-please
    if: needs.release-please.outputs.vscode-pywire--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - run: |
          cd packages/vscode-pywire
          pnpm install
          pnpm run package
          npx vsce publish --no-dependencies -p ${{ secrets.VSCE_TOKEN }}
          npx ovsx publish --no-dependencies -p ${{ secrets.OVSX_TOKEN }}

  # Publish create-pywire-app to PyPI
  publish-create-app:
    name: "Publish create-pywire-app to PyPI"
    needs: release-please
    if: needs.release-please.outputs.create-pywire-app--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/create-pywire-app
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/create-pywire-app/dist/

  # Publish the create-pywire-app npm launcher (npx create-pywire-app).
  # npm trusted publishing (OIDC): no npm token is stored anywhere. The npm
  # package must list this repo + workflow + the release environment as its
  # trusted publisher (npmjs.com → package settings → Trusted publishing).
  publish-create-app-npm:
    name: "Publish create-pywire-app to npm"
    needs: release-please
    if: needs.release-please.outputs.create-pywire-app-npm--release_created == 'true'
    runs-on: ubuntu-latest
    # Gate: publishing requires approval from the maintainers team
    # (repo Settings → Environments → release)
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: ./scripts/check
        working-directory: packages/create-pywire-app-npm
      - run: npm publish --access public
        working-directory: packages/create-pywire-app-npm

  # When pywire releases, ensure docs gets a patch release too (if docs changed since
  # last docs release). Closes any stale docs release-please PR to prevent conflicts,
  # then bumps docs/package.json + manifest via a fresh PR, tags, and creates a GH release.
  # Docs can still release independently via its own release-please PR when pywire does not release.
  sync-docs-release:
    name: "Sync docs release with pywire"
    needs: release-please
    if: needs.release-please.outputs.pywire--release_created == 'true'
    concurrency:
      group: sync-docs-release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Check docs changed since last docs release
        id: check
        run: |
          LAST_TAG=$(git tag --sort=-version:refname | grep '^pywire-docs-v' | head -1 || true)
          if [ -z "$LAST_TAG" ] || ! git diff --quiet "$LAST_TAG"..HEAD -- docs/; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      # Keep the open docs release PR's version (it may be a minor bump) but
      # cut it here, so docs ship with this pywire release; then close it.
      - name: Close stale docs release-please PR
        id: docs-pr
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          me=$(gh api user --jq .login)
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title,headRefName,isCrossRepository,author \
            | jq -c --arg me "$me" '[.[]
                | select(.headRefName == "release-please--branches--main--components--pywire-docs")
                | select((.isCrossRepository | not) and .author.login == $me)]')
          version=$(echo "$prs" | jq -r '.[0].title // ""' | sed -n 's/^.* release pywire-docs \([0-9][0-9.]*\)$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for n in $(echo "$prs" | jq -r '.[].number'); do
            echo "Closing superseded docs release PR #$n (version ${version:-unknown})"
            gh pr close "$n" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Superseded by pywire release sync, which releases docs ${version:-as a patch}." || true
          done

      - name: Bump docs version, merge, tag, release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PYWIRE_TAG: ${{ needs.release-please.outputs.pywire--tag_name }}
          PR_VERSION: ${{ steps.docs-pr.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          current=$(jq -r '.docs' .release-please-manifest.json)
          IFS='.' read -r major minor patch <<< "$current"
          new="${major}.${minor}.$((patch + 1))"
          # The docs release PR's version wins when it is higher (a minor bump).
          if [ -n "$PR_VERSION" ] && [ "$(printf '%s\n%s\n' "$new" "$PR_VERSION" | sort -V | tail -1)" = "$PR_VERSION" ]; then
            new="$PR_VERSION"
          fi
          tag="pywire-docs-v${new}"
          branch="chore/sync-docs-release-${new}"

          git checkout -b "$branch"
          jq --arg v "$new" '.docs = $v' .release-please-manifest.json > tmp && mv tmp .release-please-manifest.json
          jq --arg v "$new" '.version = $v' docs/package.json > tmp && mv tmp docs/package.json

          git add .release-please-manifest.json docs/package.json
          git commit -m "chore(pywire-docs): release ${new}"
          git push origin "$branch"

          pr_url=$(gh pr create --base main --head "$branch" \
            --title "chore(pywire-docs): release ${new}" \
            --body "Auto-synced with pywire release ${PYWIRE_TAG}.")
          gh pr merge "$pr_url" --squash --admin --delete-branch --repo "$GITHUB_REPOSITORY"

          git fetch origin main
          git tag "$tag" FETCH_HEAD
          git push origin "$tag"
          gh release create "$tag" --title "pywire-docs: ${tag}" \
            --notes "Synced with pywire release ${PYWIRE_TAG}."

  # Deploy docs to Cloudflare Pages (on pywire release with doc changes, or explicit docs release)
  deploy-docs:
    name: "Deploy Docs (Production)"
    needs: [release-please, sync-docs-release]
    if: >-
      always()
      && needs.release-please.result == 'success'
      && (
        (needs.sync-docs-release.result == 'success'
         && needs.sync-docs-release.outputs.released == 'true')
        || needs.release-please.outputs.pywire-docs--release_created == 'true'
      )
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      environment: production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
