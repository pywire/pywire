name: Deploy Docs

on:
  # A docs push to main deploys nightly. Production only deploys from the
  # release workflow (workflow_call) or a manual run.
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - production
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  # Builds the site with no secrets in reach: dependency install scripts and
  # the build itself run here, and only the built files leave the job.
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build Documentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: cd docs && pnpm run build
        env:
          PYWIRE_PYPI_INSTALL: ${{ (inputs.environment || 'nightly') == 'production' && '1' || '' }}
          PYWIRE_WASM_BUILD: ${{ (inputs.environment || 'nightly') != 'production' && '1' || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error

  # Only uploads the built files. Keep CLOUDFLARE_API_TOKEN (a token scoped to
  # Cloudflare Pages: Edit, nothing else) and CLOUDFLARE_ACCOUNT_ID in the
  # environments' secrets: `docs-production`, limited to the main branch (and
  # able to require a reviewer), and `docs-nightly`.
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy Documentation
    environment: ${{ (inputs.environment || 'nightly') == 'production' && 'docs-production' || 'docs-nightly' }}
    # Run one deploy per environment at a time so an older build can't
    # finish last and overwrite a newer one; a queued deploy is superseded
    # by the newest.
    concurrency:
      group: deploy-docs-${{ inputs.environment || 'nightly' }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Same version as the lockfile entry in docs/package.json.
          wranglerVersion: '4.136.3'
          command: >-
            pages deploy dist --project-name=pywire-docs
            --branch=${{ (inputs.environment || 'nightly') == 'production' && 'main' || 'nightly' }}
