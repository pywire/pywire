name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - production
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy Documentation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: cd docs && pnpm run build
        env:
          PYWIRE_PYPI_INSTALL: ${{ (inputs.environment || 'production') == 'production' && '1' || '' }}
          PYWIRE_WASM_BUILD: ${{ (inputs.environment || 'production') != 'production' && '1' || '' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: pywire-docs
          directory: docs/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ (inputs.environment || 'production') == 'production' && 'main' || 'nightly' }}
