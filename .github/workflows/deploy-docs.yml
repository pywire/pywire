name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - production
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy Documentation
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: cd docs && pnpm run build
        env:
          PYWIRE_PYPI_INSTALL: ${{ (inputs.environment || 'production') == 'production' && '1' || '' }}
          PYWIRE_WASM_BUILD: ${{ (inputs.environment || 'production') != 'production' && '1' || '' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # wrangler lives in docs devDeps; run there so the action finds it
          # instead of ad-hoc `pnpm add` (which fails at a workspace root).
          workingDirectory: docs
          command: >-
            pages deploy dist --project-name=pywire-docs
            --branch=${{ (inputs.environment || 'production') == 'production' && 'main' || 'nightly' }}
