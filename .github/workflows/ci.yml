name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]

# New pushes to a PR supersede older runs; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Determine which packages changed. Each package has its own filter; jobs
  # combine filters for upstream dependencies so a change to e.g. pywire-parser
  # reruns every downstream package's tests, but nothing else.
  changes:
    runs-on: ubuntu-latest
    outputs:
      pywire: ${{ steps.filter.outputs.pywire }}
      parser: ${{ steps.filter.outputs.parser }}
      cli: ${{ steps.filter.outputs.cli }}
      templates: ${{ steps.filter.outputs.templates }}
      auth: ${{ steps.filter.outputs.auth }}
      ls: ${{ steps.filter.outputs.ls }}
      vscode: ${{ steps.filter.outputs.vscode }}
      prettier: ${{ steps.filter.outputs.prettier }}
      treesitter: ${{ steps.filter.outputs.treesitter }}
      create-app: ${{ steps.filter.outputs.create-app }}
      examples: ${{ steps.filter.outputs.examples }}
      pywire-docs: ${{ steps.filter.outputs.pywire-docs }}
    steps:
      - name: Check if release commit
        id: release-check
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MSG" == "chore(main): release"* ]] || [[ "$MSG" == *"release-please"* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v7
        if: steps.release-check.outputs.is_release != 'true'
      - uses: dorny/paths-filter@v4
        if: steps.release-check.outputs.is_release != 'true'
        id: filter
        with:
          base: main
          filters: |
            pywire:
              - 'packages/pywire/**'
            parser:
              - 'packages/pywire-parser/**'
            cli:
              - 'packages/pywire-cli/**'
            templates:
              - 'packages/pywire-templates/**'
            auth:
              - 'packages/pywire-auth/**'
            ls:
              - 'packages/pywire-language-server/**'
            vscode:
              - 'packages/vscode-pywire/**'
            prettier:
              - 'packages/prettier-plugin-pywire/**'
            treesitter:
              - 'packages/tree-sitter-pywire/**'
            create-app:
              - 'packages/create-pywire-app/**'
            examples:
              - 'examples/**'
            pywire-docs:
              - 'docs/**'
              - '!docs/superpowers/**'

  # pywire-parser: parser + analysis engine. Wraps tree-sitter-pywire.
  check-pywire-parser:
    name: "Check PyWire Parser"
    needs: changes
    if: needs.changes.outputs.parser == 'true' || needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd packages/pywire-parser && ./scripts/check

  # pywire-templates: Jinja deploy templates. Lint only — consumers test renders.
  check-pywire-templates:
    name: "Check PyWire Templates"
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd packages/pywire-templates && ./scripts/check

  # pywire core: framework + Python runtime + TS client bundle.
  # Reruns when parser changes (compiler uses PyWireParser) or when the
  # tree-sitter grammar changes (parser wraps it).
  check-pywire:
    name: "Check PyWire Core"
    needs: changes
    if: >
      needs.changes.outputs.pywire == 'true' ||
      needs.changes.outputs.parser == 'true' ||
      needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright Browsers
        run: uv run --extra dev playwright install --with-deps
        working-directory: packages/pywire
      - name: Python Checks
        run: cd packages/pywire && ./scripts/check

  # pywire-cli: CLI tools. Depends on pywire (runtime), pywire-parser (analysis),
  # pywire-templates (deploy renders), tree-sitter-pywire (via parser).
  check-pywire-cli:
    name: "Check PyWire CLI"
    needs: changes
    if: >
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.pywire == 'true' ||
      needs.changes.outputs.parser == 'true' ||
      needs.changes.outputs.templates == 'true' ||
      needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd packages/pywire-cli && ./scripts/check

  # pywire-auth: auth providers + stores. Depends on pywire.
  check-pywire-auth:
    name: "Check PyWire Auth"
    needs: changes
    if: >
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.pywire == 'true' ||
      needs.changes.outputs.parser == 'true' ||
      needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd packages/pywire-auth && ./scripts/check

  # Language Server: depends on pywire (runtime types), pywire-parser (analysis),
  # tree-sitter-pywire (via parser).
  check-language-server:
    name: "Check Language Server"
    needs: changes
    if: >
      needs.changes.outputs.ls == 'true' ||
      needs.changes.outputs.pywire == 'true' ||
      needs.changes.outputs.parser == 'true' ||
      needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd packages/pywire-language-server && ./scripts/check

  # VS Code Extension: lint, build
  check-vscode:
    name: "Check VS Code Extension"
    needs: changes
    if: needs.changes.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Run Checks
        run: cd packages/vscode-pywire && ./scripts/check

  # Prettier Plugin: lint, build
  check-prettier:
    name: "Check Prettier Plugin"
    needs: changes
    if: needs.changes.outputs.prettier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Run Checks
        run: cd packages/prettier-plugin-pywire && ./scripts/check

  # Tree-sitter Grammar: build, test
  check-treesitter:
    name: "Check Tree-sitter Grammar"
    needs: changes
    if: needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/tree-sitter-pywire
      - name: Cargo Tests
        run: cd packages/tree-sitter-pywire && cargo test

  # create-pywire-app: depends on pywire-templates for deploy renders.
  check-create-app:
    name: "Check Create PyWire App"
    needs: changes
    if: needs.changes.outputs.create-app == 'true' || needs.changes.outputs.templates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd packages/create-pywire-app && ./scripts/check

  # Examples: verify demos still compile + pass smoke tests against pywire.
  check-examples:
    name: "Check Examples"
    needs: changes
    if: >
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.pywire == 'true' ||
      needs.changes.outputs.parser == 'true' ||
      needs.changes.outputs.treesitter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run Checks
        run: cd examples && ./scripts/check

  # PyWire Interactive Docs
  check-pywire-docs:
    name: "Check PyWire Docs"
    needs: changes
    if: needs.changes.outputs.pywire-docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Run Checks
        run: cd docs && ./scripts/check

  # "Release Floors Gate" is a required status check, but its real evaluation
  # lives in release.yml (push to main) and only posts on release-please PRs,
  # which never trigger pull_request workflows. Regular PRs get a pass-through
  # success here so the required check resolves; floors on feature PRs are
  # governed by the AGENTS.md release protocol.
  floors-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post Release Floors Gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context="Release Floors Gate" \
            -f description="Feature PR — floors governed by AGENTS.md release protocol" \
            --silent

  # Always-on: the derived monorepo graph is the source of truth for
  # version floors, ci.yml fan-outs and the local-tooling contract.
  # Runs in seconds on the runner's system python3 (no uv sync, no
  # paths filter — floors must hold on release PRs too).
  check-monorepo-graph:
    name: "Check Monorepo Graph"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check floors, ci fan-out, tooling contract
        run: |
          python3 scripts/monorepo_graph.py check-floors
          python3 scripts/monorepo_graph.py check-ci
          python3 scripts/monorepo_graph.py check-scripts
      - name: Graph tool tests
        run: uv run --no-project --with pytest -- pytest scripts/tests -q
