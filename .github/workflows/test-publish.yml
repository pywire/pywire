name: Test Publish

on:
  workflow_dispatch:
    inputs:
      pywire:
        description: "Publish pywire"
        type: boolean
        default: false
      pywire-parser:
        description: "Publish pywire-parser"
        type: boolean
        default: false
      pywire-language-server:
        description: "Publish pywire-language-server"
        type: boolean
        default: false
      tree-sitter-pywire:
        description: "Publish tree-sitter-pywire"
        type: boolean
        default: false
      create-pywire-app:
        description: "Publish create-pywire-app"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Build pywire (pure Python wheel + sdist)
  build-pywire:
    name: "Build pywire"
    if: inputs.pywire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Append dev version suffix
        run: sed -i 's/^version = "\(.*\)"/version = "\1.dev${{ github.run_number }}"/' pyproject.toml
        working-directory: packages/pywire
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Build JS client
        run: pnpm install && pnpm build
        working-directory: packages/pywire/src/pywire/client
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --out-dir dist
        working-directory: packages/pywire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pywire-dist
          path: packages/pywire/dist/*

  # Publish pywire to Test PyPI
  publish-pywire:
    name: "Publish pywire to Test PyPI"
    needs: build-pywire
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pywire-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # Build tree-sitter-pywire wheels (C extension, cross-platform)
  build-tree-sitter-pywire:
    name: "Build tree-sitter-pywire wheels"
    if: inputs.tree-sitter-pywire
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Append dev version suffix
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path("packages/tree-sitter-pywire/pyproject.toml")
          p.write_text(re.sub(r'(?m)^version = "(.*)"', r'version = "\1.dev${{ github.run_number }}"', p.read_text()))
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: packages/tree-sitter-pywire
        env:
          CIBW_BUILD: "cp310-*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-pywire-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Build tree-sitter-pywire sdist
  build-tree-sitter-pywire-sdist:
    name: "Build tree-sitter-pywire sdist"
    if: inputs.tree-sitter-pywire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Append dev version suffix
        run: sed -i 's/^version = "\(.*\)"/version = "\1.dev${{ github.run_number }}"/' pyproject.toml
        working-directory: packages/tree-sitter-pywire
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --sdist --out-dir dist
        working-directory: packages/tree-sitter-pywire
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-pywire-sdist
          path: packages/tree-sitter-pywire/dist/*.tar.gz

  # Publish tree-sitter-pywire to Test PyPI
  publish-tree-sitter-pywire:
    name: "Publish tree-sitter-pywire to Test PyPI"
    needs: [build-tree-sitter-pywire, build-tree-sitter-pywire-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tree-sitter-pywire-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # Build the pure-Python packages without the publish token in reach; each
  # publish job below only downloads what was built and uploads it.
  build-python:
    name: "Build ${{ matrix.package }}"
    if: inputs.pywire-parser || inputs.pywire-language-server || inputs.create-pywire-app
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [pywire-parser, pywire-language-server, create-pywire-app]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs[matrix.package]
      - name: Append dev version suffix
        if: inputs[matrix.package]
        run: sed -i 's/^version = "\(.*\)"/version = "\1.dev${{ github.run_number }}"/' pyproject.toml
        working-directory: packages/${{ matrix.package }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: inputs[matrix.package]
      - run: uv build --out-dir dist
        if: inputs[matrix.package]
        working-directory: packages/${{ matrix.package }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs[matrix.package]
        with:
          name: ${{ matrix.package }}-dist
          path: packages/${{ matrix.package }}/dist/*

  # Publish pywire-parser to Test PyPI
  publish-pywire-parser:
    name: "Publish pywire-parser to Test PyPI"
    if: inputs.pywire-parser
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pywire-parser-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # Publish pywire-language-server to Test PyPI
  publish-language-server:
    name: "Publish pywire-language-server to Test PyPI"
    if: inputs.pywire-language-server
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pywire-language-server-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  # Publish create-pywire-app to Test PyPI
  publish-create-app:
    name: "Publish create-pywire-app to Test PyPI"
    if: inputs.create-pywire-app
    needs: build-python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: create-pywire-app-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
