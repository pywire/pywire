name: Deploy Examples

# demo.pywire.dev: the landing page and the stateless examples, each on its
# own Cloudflare Worker at demo.pywire.dev/<name>. The examples run the
# pywire on main (not PyPI), so a core change redeploys them too. Examples
# aren't released, so release-please isn't involved.
on:
  push:
    branches: [main]
    paths:
      - 'examples/demo-site/**'
      - 'examples/edge-stateless/**'
      - 'examples/form-builder/**'
      - 'examples/scripts/deploy-demo'
      - 'packages/pywire/src/**'
      - 'packages/pywire-cli/src/**'
      - 'packages/pywire-templates/src/**'
      - '.github/workflows/deploy-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.demo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        demo: [site, edge-stateless, form-builder]
    # One deploy per demo at a time, so an older build can't finish last.
    concurrency:
      group: deploy-examples-${{ matrix.demo }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false

      # The client bundle isn't committed; the Worker ships the one built here.
      - name: Build the pywire client
        if: matrix.demo != 'site'
        run: |
          pnpm install
          pnpm --dir packages/pywire/src/pywire/client build

      - name: Build and deploy
        run: examples/scripts/deploy-demo ${{ matrix.demo }} --deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
