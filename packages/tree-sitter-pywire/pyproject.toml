[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-pywire"
description = "PyWire grammar for tree-sitter"
version = "0.3.8"
keywords = ["incremental", "parsing", "tree-sitter", "pywire"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
authors = [
    { name = "Reece Holmdahl", email = "reece@pywire.dev" },
]
requires-python = ">=3.10"
license = { file = "LICENSE" }
readme = "README.md"

[project.urls]
Homepage = "https://github.com/pywire/pywire"

[project.optional-dependencies]
core = ["tree-sitter~=0.23"]

[tool.cibuildwheel]
# Build CPython 3.10+ wheels; WASM wheel built with pyodide-build==0.29.3 and uploaded to R2 CDN
build = "cp310-*"
build-frontend = "build"
