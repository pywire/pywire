[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywire-cli"
version = "0.1.0"
description = "Command-line tools for PyWire projects: dev, build, deploy, check"
authors = [
    { name = "Reece Holmdahl", email = "reece@pywire.dev" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pywire[build]",
    "pywire-templates",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.27.0",
    "watchfiles>=0.21.0",
    "textual>=7.4.0",
    "rich-click>=1.9.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "ty",
]

[project.scripts]
pywire = "pywire_cli.main:cli"

[project.urls]
Homepage = "https://pywire.dev"
Documentation = "https://pywire.dev/docs"
Repository = "https://github.com/pywire/pywire"
Issues = "https://github.com/pywire/pywire/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pywire_cli"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "pywire_parser",
    "pywire_parser.**",
    "pywire_templates",
    "pywire_templates.**",
]

[[tool.ty.overrides]]
include = ["tests/**"]
rules = { possibly-missing-attribute = "ignore", invalid-argument-type = "ignore", unresolved-attribute = "ignore", unresolved-import = "ignore" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pywire_cli"
