[project]
name = "create-pywire-app"
version = "0.12.1"
description = "Init wizard for new pywire projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "jinja2>=3.1.0",
    "pywire-templates>=0.2.0",
]

[project.scripts]
create-pywire-app = "create_pywire_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "nox",
    "ty",
    "ruff",
]

[tool.ty.src]
exclude = [
    "src/create_pywire_app/templates",
]

[tool.ty.rules]
# ty (unpinned in nox venvs) flaps on the set_event_loop_policy directive:
# versions that flag the 3.14 deprecation need it; older ones call it unused.
unused-ignore-comment = "ignore"

