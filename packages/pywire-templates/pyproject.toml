[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywire-templates"
version = "0.1.0"
description = "Shared Jinja2 templates for PyWire deployment and scaffolding"
authors = [
    { name = "Reece Holmdahl", email = "reece@pywire.dev" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://pywire.dev"
Repository = "https://github.com/pywire/pywire"

[tool.hatch.build.targets.wheel]
packages = ["src/pywire_templates"]

[tool.hatch.build.targets.wheel.force-include]
"src/pywire_templates/deploy" = "pywire_templates/deploy"
