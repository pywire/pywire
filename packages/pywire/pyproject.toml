[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywire"
version = "0.11.4"
authors = [
    { name="Reece Holmdahl", email="reece@pywire.dev" },
]
description = "HTML-over-the-wire Python web framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "starlette>=0.35.0",
    "python-multipart>=0.0.6",
    "msgpack>=1.0.0",
]

[project.optional-dependencies]
forms = [
    "pydantic>=2.0.0",
]
build = [
    "pywire-parser>=0.1.0",
]
cli = [
    "pywire[build]",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.27.0",
    "watchfiles>=0.21.0",
    "textual>=7.4.0",
    "rich-click>=1.9.6",
]
dev = [
    "pywire[cli,forms]",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ty",
    "httpx>=0.23.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.0",
    "msgpack-types",
    "nox",
    "build>=1.0.0",
    "pytest-playwright",
]
http3 = [
    "aioquic>=0.9.0",
    "hypercorn>=0.14.0",
]
redis = [
    "redis>=5.0.0",
]

[project.scripts]
pywire = "pywire.cli.main:cli"

[project.urls]
Homepage = "https://pywire.dev"
Documentation = "https://pywire.dev/docs"
Repository = "https://github.com/pywire/pywire"
Issues = "https://github.com/pywire/pywire/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pywire"]

[tool.hatch.build.targets.wheel.shared-data]

[tool.hatch.build]
include = [
    "src/pywire/**",
]

[tool.ruff.lint]
per-file-ignores = { "docs/public/shim.py" = ["E402"], "setup.py" = ["E402"], "tests/repro_*.py" = ["E402", "F821"], "tests/e2e/test_regression.py" = ["E402"] }

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["docs/public/shim.py", "setup.py"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "pywire_parser",
    "pywire_parser.**",
    "aioquic.**",
    "cryptography.**",
    "hypercorn.**",
    "hatchling.**",
    "lxml.**",
    "js",
    "pyodide.**",
]

[[tool.ty.overrides]]
include = ["tests/**"]
rules = { possibly-missing-attribute = "ignore", invalid-argument-type = "ignore", unresolved-attribute = "ignore", call-non-callable = "ignore", invalid-method-override = "ignore", redundant-cast = "ignore", unresolved-reference = "ignore", invalid-assignment = "ignore", too-many-positional-arguments = "ignore", possibly-missing-submodule = "ignore", unresolved-import = "ignore", not-iterable = "ignore" }

[[tool.ty.overrides]]
include = ["src/pywire/compiler/codegen/**"]
rules = { no-matching-overload = "ignore", invalid-argument-type = "ignore" }

[[tool.ty.overrides]]
include = ["src/pywire/runtime/redis_store.py"]
rules = { unresolved-import = "ignore", invalid-await = "ignore" }

[[tool.ty.overrides]]
include = ["src/pywire/runtime/pydantic_integration.py"]
rules = { invalid-assignment = "ignore" }

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["emsdk", "docs", "src/pywire/client"]
addopts = "--cov=pywire"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["src/pywire"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
