[project]
name = "example-form-builder"
version = "0.1.0"
description = "Describe a form in a sentence: an open model writes the fields, Jev decides their types, pywire runs the form."
requires-python = ">=3.11"
dependencies = ["pywire[forms]", "httpx>=0.27"]

[dependency-groups]
dev = ["pywire[cli]", "pytest>=8", "ruff"]

[tool.uv.sources]
pywire = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
