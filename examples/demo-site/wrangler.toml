# demo.pywire.dev: this static page. Each example is its own Worker at
# demo.pywire.dev/<name>. The routes and DNS live in pywire/pywire.dev's
# Terraform, which sends the more specific example routes to the examples.
name = "pywire-demo"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
not_found_handling = "404-page"
