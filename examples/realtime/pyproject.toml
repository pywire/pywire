[project]
name = "example-realtime"
version = "0.1.0"
description = "Shared state between users: a live poll, presence, chat, and races on shared data."
requires-python = ">=3.11"
dependencies = ["pywire"]

[dependency-groups]
dev = ["pywire[cli]", "pytest>=8", "httpx", "ruff"]

[tool.uv.sources]
pywire = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
