packages:
  - "packages/pywire/src/pywire/client"
  - "docs"
  - "packages/tree-sitter-pywire"
  - "packages/vscode-pywire"
  - "packages/prettier-plugin-pywire"

# pnpm 10+ skips dependency build scripts unless approved here.
allowBuilds:
  '@parcel/watcher': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: false
  sharp: true
  tree-sitter-cli: true
  workerd: true

overrides:
  dompurify: ^3.4.13
